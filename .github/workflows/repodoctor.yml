name: RepoDoctor Health & Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  repodoctor:
    name: RepoDoctor Health & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Run RepoDoctor Diagnostic Scan
        run: node dist/index.js --ci --sarif repodoctor.sarif --markdown $GITHUB_STEP_SUMMARY

      - name: Upload Security SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('repodoctor.sarif') != ''
        with:
          sarif_file: repodoctor.sarif
