<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="RepoDoctor logo">
  <title>RepoDoctor</title>
  <defs>
    <linearGradient id="rd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c4ff"/>
      <stop offset="1" stop-color="#ff6aff"/>
    </linearGradient>
    <linearGradient id="rd-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f7ff"/>
      <stop offset="1" stop-color="#90f2ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square shield -->
  <rect x="20" y="20" width="216" height="216" rx="52" fill="url(#rd-bg)"/>

  <!-- Inner accent ring -->
  <rect x="46" y="46" width="164" height="164" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Heartbeat pulse line, styled like a code reading -->
  <polyline
    fill="none"
    stroke="url(#rd-pulse)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    points="44,128 88,128 96,128 104,96 116,164 132,56 148,164 158,128 168,128 212,128"
  />

  <!-- Baseline beats -->
  <circle cx="44" cy="128" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="212" cy="128" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
</svg>